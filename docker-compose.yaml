# -------------------------------------------------------------------------
# 🐳 DOCKER COMPOSE - ENTORNO DE PRODUCCIÓN / INTEGRACIÓN GLOBAL
# - AUTOR: @DevSoft Team
# - DESCRIPCION: Levanta la infraestructura completa del ecosistema distribuido
# -              (2 Microservicios independientes + 2 Bases de Datos dedicadas)
# -------------------------------------------------------------------------

services:

  # =======================================================================
  # 📦 COMPONENTE 1: DOMINIO DE PRODUCTOS (API + BASE DE DATOS)
  # =======================================================================

  # 🐬 Servidor MySQL dedicado a Productos
  db_products:
    image: mysql:9.0
    container_name: production_mysql_server_products
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD_PRODUCTS}
      MYSQL_DATABASE: ${DB_NAME_PRODUCTS}
      MYSQL_USER: ${DB_USER_PRODUCTS}
      MYSQL_PASSWORD: ${DB_PASSWORD_PRODUCTS}
    ports:
      - "3310:3306" # Expuesto para inspección desde el host físico
    command: --lower_case_table_names=1
    volumes:
      - production_mysql_data_products:/var/lib/mysql
      # Script de inicialización de productos
      - ./products/.devcontainer/mysql-products-schema-v1.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ntw_production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER_PRODUCTS:-products}", "-p${DB_PASSWORD_PRODUCTS:-products2026}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🚀 Aplicación Java de Productos (Imagen compila con su Dockerfile)
  products-app:
    image: workshop/products-service:latest
    container_name: microservice_products_app
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod # 🚀 ACTIVA EL PERFIL DE PRODUCCIÓN
      DB_HOSTNAME: ${DB_PRODUCTS_HOSTNAME}
      DB_PORT: ${DB_PRODUCTS_PORT}
      DB_NAME: ${DB_NAME_PRODUCTS}
      DB_USER: ${DB_USER_PRODUCTS}
      DB_PASSWORD: ${DB_PASSWORD_PRODUCTS}
    ports:
      - "8088:8080"
    # Hereda la red de db_products para mantener el network_mode del taller si se requiere,
    # o se conecta de forma directa a la red compartida bridge:
    networks:
      - ntw_production
    depends_on:
      db_products:
        condition: service_healthy

  # =======================================================================
  # 👥 COMPONENTE 2: DOMINIO DE USUARIOS (API + BASE DE DATOS)
  # =======================================================================

  # 🐬 Servidor MySQL dedicado a Usuarios
  db_users:
    image: mysql:9.0
    container_name: production_mysql_server_users
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-workshop2026++}
      MYSQL_DATABASE: ${DB_NAME_USERS:-usersdb}
      MYSQL_USER: ${DB_USER_USERS:-workshop}
      MYSQL_PASSWORD: ${DB_PASSWORD_USERS:-workshop2026}
    ports:
      - "3311:3306" # Mapea puerto externo 3308 para no colisionar con productos
    volumes:
      - production_mysql_data_users:/var/lib/mysql
      # Script de inicialización de usuarios con Foreign Key local
      - ./users/mysql-users-schema-v1.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --lower_case_table_names=1
    networks:
      - ntw_production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER_USERS:-workshop}", "-p${DB_PASSWORD_USERS:-workshop2026}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🚀 Aplicación Java de Usuarios (Imagen compila con su Dockerfile)
  users-app:
    image: workshop/users-service:latest
    container_name: microservice_users_app
    restart: always
    ports:
      - "8081:8081"
    environment:
      # 🚨 INYECCIÓN DINÁMICA CRÍTICA: Mapea la ubicación del otro microservicio.
      # Apunta al nombre del contenedor de la BD de productos (o a su contenedor app en el puerto 8080)
      - SPRING_PROFILES_ACTIVE=prod # 🚀 ACTIVA EL PERFIL DE PRODUCCIÓN
      - PRODUCTS_API_URL=http://microservice_products_app:8080
      - DB_NAME=usersdb
      - DB_USER=workshop
      - DB_PASSWORD=workshop2026
    networks:
      - ntw_production
    depends_on:
      db_users:
        condition: service_healthy
      products-app:
        condition: service_started

# =======================================================================
# 🌐 RED COMÚN EXTERNA Y VOLÚMENES PERSISTENTES
# =======================================================================
networks:
  ntw_production:
    name: ntw_production
    external: true # Se acopla a la red común puente pre-creada en la terminal

volumes:
  production_mysql_data_products:
  production_mysql_data_users:
