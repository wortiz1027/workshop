apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: products-app-hpa
  namespace: workshop-k8s
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: products-app # 🚀 Aprieta el acelerador sobre el microservicio de productos
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50 # 🔥 Si la llamada interna de usuarios satura el 50% de CPU, genera un nuevo Pod de productos
