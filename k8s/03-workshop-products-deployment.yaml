apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-app
  namespace: workshop-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-app
  template:
    metadata:
      labels:
        app: products-app
    spec:
      containers:
        - name: products-container
          image: workshop/products-service:latest
          imagePullPolicy: IfNotPresent # 🐳 Si ya la compilaste en el nodo, la usa de inmediato
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_NAME
              value: productsdb
            - name: DB_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: workshop-shared-config
                  key: DB_HOSTNAME
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: workshop-shared-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: workshop-shared-config
                  key: DB_USER_PRODUCTS
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workshop-shared-secret
                  key: DB_PASSWORD_PRODUCTS
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m" # Capado para que reaccione rápido al estrés
            limits:
              memory: "256Mi"
              cpu: "150m"