services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: always
    ports:
      - "4317:4317" # Puerto gRPC OTLP
      - "4318:4318" # Puerto HTTP OTLP
      - "12345:12345" # Panel de control de Alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
      - --stability.level=experimental
    volumes:
      - vlm_users_logs:/var/log/spring/users:ro
      - vlm_products_logs:/var/log/spring/products:ro
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - ntw_development

  tempo:
    image: grafana/tempo:2.10.4
    container_name: tempo
    restart: always    
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./configs/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo UI/API
    networks:
      - ntw_development     

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: jaeger
    hostname: jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Puerto del Dashboard Visual de Jaeger
      - "4317:4317"   # Puerto receptor OTLP (gRPC) - Al que apuntarán las apps
      - "4318:4318" # OTLP HTTP
    volumes:  
      - ./configs/jaeger/jaeger.yaml:/etc/jaeger/jaeger.yaml
    networks:
      - ntw_development
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml
    networks:
      - ntw_development

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin    
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ntw_development
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ntw_development

networks:
  ntw_development:
    name: ntw_development
    external: true

volumes:
  portainer_data:
  vlm_users_logs:
    external: true
  vlm_products_logs:
    external: true
