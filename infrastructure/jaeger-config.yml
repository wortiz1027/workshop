receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  memory: # In-memory storage for development (replaces v1's memory storage)
    max_traces: 50000

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [memory]
