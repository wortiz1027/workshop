server:
  port: 8081

spring:
  application:
    name: users
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# 🚀 SECCIÓN DE OBSERVABILIDAD CORREGIDA (SPRING BOOT 4)
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}

eureka:
  client:
    # 🚨 ACCIÓN CRÍTICA: Cambia el puerto al valor real de tu Eureka (9761)
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOSTNAME:eureka-server}:${EUREKA_SERVER_PORT:8761}/eureka/
  instance:
    # Latidos rápidos para el laboratorio local
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10         