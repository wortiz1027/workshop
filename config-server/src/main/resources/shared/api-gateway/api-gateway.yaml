server:
  port: 8000
  
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOSTNAME:eureka-server}:${EUREKA_SERVER_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: products
              uri: lb://products
              predicates:
                - Path=/api/products/**

            - id: users-route
              uri: lb://users
              predicates:
                - Path=/api/users/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # 🚨 LA REGLA DE ORO: Apunta al contenedor interno de Keycloak.
          # Usamos el Realm 'workshop-realm' (lo crearemos en la consola web)
          issuer-uri: http://${KEYCLOAK_SERVER_HOSTNAME:keycloak}:${KEYCLOAK_SERVER_PORT:8080}/realms/workshop-realm
          # Alternativa para desarrollo local si la resolución de hilos falla:
          jwk-set-uri: http://${KEYCLOAK_SERVER_HOSTNAME:keycloak}:${KEYCLOAK_SERVER_PORT:8080}/realms/workshop-realm/protocol/openid-connect/certs