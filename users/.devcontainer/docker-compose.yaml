services:
  # ☕ Java Development Container
  users:
    image: mcr.microsoft.com/devcontainers/java:1-21-bullseye
    volumes:
      - ../..:/workspaces:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    network_mode: service:db_users
    depends_on:
      db_users:
        condition: service_healthy

  # 🐬 MySQL Database
  db_users:
    image: mysql:9.0
    container_name: dev_srv_users
    hostname: service-users
    restart: always
    #command: --lower_case_table_names=1
    environment:
      # Ofuscación mediante interpolación de variables con fallback seguro
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    networks:
      - ntw_development
    volumes:
      - mysql_data_users:/var/lib/mysql
      - ./mysql-users-schema-v1.sql:/docker-entrypoint-initdb.d/mysql-users-schema-v1.sql
    healthcheck:
      # Corregido: Usamos las variables dinámicas también en la prueba de salud
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data_users:

networks:
  ntw_development:
    external: true