server:
  port: 8080
spring:
  application:
    name: microservice
  profiles:
    # 🚀 Maven inyectará aquí el valor del perfil seleccionado durante el 'package'
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl