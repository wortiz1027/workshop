server:
  port: 8080
spring:
  application:
    name: products
  profiles:
    # 🚀 Maven inyectará aquí el valor del perfil seleccionado durante el 'package'
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

  # Generic OpenTelemetry configuration (partially shared between metrics and traces)
  opentelemetry:
    resource-attributes:
      application: ${spring.application.name}
      cluster: local

  # Traces-specific OpenTelemetry configuration
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traceso