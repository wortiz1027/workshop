server:
    port: 8080

spring:
    datasource:
        url: jdbc:mysql://${DB_HOSTNAME}:${DB_PORT}/${DB_NAME:productsdb}?useSSL=false&serverTimezone=UTC&noAccessToProcedureBodies=false
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: validate