server:
    port: 8080

spring:
    datasource:
        url: jdbc:mysql://service_products:3306/${DB_NAME:productsdb}?useSSL=false&serverTimezone=UTC
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: validate