server:
    port: 8080

spring:
    datasource:
        url: jdbc:mysql://${DB_HOSTNAME}:${DB_PORT}/${DB_NAME:productsdb}?useSSL=false&serverTimezone=UTC
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
            # ⚡ CONFIGURACIÓN HIKARI AGRESIVA PARA PRODUCCIÓN (ESTRÉS)
        hikari:
            pool-name: products-prd-hikari-pool
            # Mismo número en maximum y minimum precalienta todas las conexiones al arrancar
            # Evita la penalización de tiempo de crear conexiones bajo demanda en picos de tráfico
            maximum-pool-size: 20
            minimum-idle: 20
            # Reducimos el timeout a 15 segundos para fallar rápido (Fail-Fast) si la BD se satura
            connection-timeout: 15000
            # Control estricto de vida de conexiones para evitar fugas y "conexiones muertas"
            idle-timeout: 300000
            max-lifetime: 1200000
            # Query de validación rápida para asegurar que la conexión sigue viva antes de usarla
            connection-test-query: SELECT 1
        proxy:
          logging: info
          query:
            enable-logging: true
            log-entry-creator: single-line # Muestra la query en una sola línea compacta dentro de Jaeger
    jpa:
        hibernate:
            ddl-auto: validate

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  otlp:
    metrics:
      export:
        url: http://alloy:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://alloy:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://alloy:4318/v1/logs            