services:
  # ☕ Java Development Container
  products:
    image: mcr.microsoft.com/devcontainers/java:1-21-bullseye
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy

  # 🐬 MySQL Database
  db:
    image: mysql:9.0
    container_name: dev_srv_products
    hostname: service-products
    restart: always
    #command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    networks:
      - ntw_development      
    volumes:
      - mysql_data_products:/var/lib/mysql
      - ./mysql-products-schema-v1.sql:/docker-entrypoint-initdb.d/mysql-products-schema-v1.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data_products:

networks:
  ntw_development:
    external: true